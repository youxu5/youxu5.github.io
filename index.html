<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的 · 主页</title>
<style>
/* ============================================================
   网易云「我的」主页风格 · 清透玻璃
   ============================================================ */
:root{
  --ink:#1f2a21;
  --ink-2:#55635a;
  --ink-3:#8b9a8f;
  --white:#ffffff;
  --red:#e5484d;
  --mint:#dff0e0;
  --glass:rgba(255,255,255,.42);
  --glass-hi:rgba(255,255,255,.60);
  --glass-line:rgba(255,255,255,.55);
  --radius:14px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Songti SC","Noto Serif SC","SimSun","STSong",serif;
  font-size:15.5px; line-height:1.75; color:var(--ink);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  background:#dfe8d8;
  overflow-x:hidden;
}

/* ===== 全屏背景图：轻微磨砂 = 略去绿、提亮、背景微模糊 ===== */
#bg{
  position:fixed; inset:0; z-index:0;
  background-size:cover; background-position:center;
  filter:saturate(.62) brightness(1.06) contrast(.98) blur(3px);
  transform:scale(1.04);
}
#bg::after{
  content:""; position:absolute; inset:0;
  background:
    linear-gradient(180deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,.10) 34%,
      rgba(248,251,248,.16) 70%, rgba(240,246,241,.30) 100%);
}

/* ===== 水雾层：飘在背景图之上，营造湿玻璃感 ===== */
#fog{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:
    radial-gradient(760px 340px at 22% 12%, rgba(198,214,200,.16), transparent 72%),
    radial-gradient(660px 300px at 80% 68%, rgba(180,198,184,.13), transparent 74%),
    radial-gradient(520px 260px at 50% 40%, rgba(170,190,174,.10), transparent 76%);
  mix-blend-mode:screen;
  animation:fog-drift 24s ease-in-out infinite alternate;
}
@keyframes fog-drift{
  from{transform:translate3d(0,0,0) scale(1); opacity:.30}
  to{transform:translate3d(-2%,1.2%,0) scale(1.06); opacity:.44}
}

/* ===== 下雨层：不间断的细雨（清透白色细线，压在背景之上内容之下） ===== */
#rain{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  opacity:.45;
}

/* 手机栏容器 */
.phone{
  position:relative; z-index:3;
  max-width:460px; margin:0 auto; min-height:100vh;
  display:flex; flex-direction:column;
}

/* ===== 顶栏（黑色玻璃，通铺到屏幕最左最右） ===== */
.topbar{
  position:sticky; top:0; z-index:30;
  width:100vw; margin-left:calc(50% - 50vw);
  display:flex; align-items:center; justify-content:space-between;
  /* 内容仍约束在中间 460px 内：宽屏时用大 padding 撑住 */
  padding:14px max(16px, calc(50vw - 214px));
  background:rgba(14,18,14,.46);
  backdrop-filter:blur(12px) saturate(130%);
  -webkit-backdrop-filter:blur(12px) saturate(130%);
  border-bottom:1px solid rgba(255,255,255,.14);
}
.topbar .side{display:flex; align-items:center; gap:18px; font-size:19px; color:#eef4ec;
  cursor:pointer; text-shadow:0 1px 3px rgba(0,0,0,.35)}
.topbar .status{font-size:13px; color:#f2f6f0; opacity:.95;
  cursor:pointer; text-shadow:0 1px 3px rgba(0,0,0,.35)}

/* ===== 头部 ===== */
.head{ text-align:center; padding:26px 20px 10px; color:#101a12;
  text-shadow:0 1px 6px rgba(255,255,255,.85), 0 0 14px rgba(255,255,255,.9);
  position:relative;
}
/* 头部文字底下的柔光提亮：只罩文字周围，让字压在亮背景上也清楚 */
.head::before{
  content:""; position:absolute; inset:-30px -10px -6px; z-index:-1;
  background:radial-gradient(62% 88% at 50% 42%, rgba(255,255,255,.42), transparent 78%);
  border-radius:0 0 40% 40%;
  pointer-events:none;
}
.avatar{
  width:124px; height:124px; border-radius:50%; object-fit:cover;
  border:3px solid rgba(255,255,255,.95);
  box-shadow:0 8px 26px rgba(70,105,72,.24), 0 0 0 6px rgba(255,255,255,.26);
  display:block; margin:0 auto 12px;
}
.name-row{display:flex; align-items:center; justify-content:center; gap:8px; text-align:center}
.name-row h1{font-size:23px; font-weight:500; letter-spacing:.06em; text-align:center}
.vip{
  font-size:10px; background:rgba(20,20,20,.55); border:1px solid rgba(255,255,255,.4);
  color:#f4e6b8; border-radius:999px; padding:2px 9px; letter-spacing:.05em;
}
.vip:empty{display:none}
.badges{font-size:11.5px; opacity:.9; margin-top:7px}

/* ===== 名字右下角透明底 SVIP 徽章动画（唱片滑出滑回） ===== */
.name-wrap{position:relative; display:inline-block}
.svip-badge{
  /* 可按需调：整体缩放 */
  --badge-h:20px;
  position:absolute; right:-74px; bottom:2px;
  display:inline-flex; align-items:center;
  height:var(--badge-h);
  padding:0 calc(var(--badge-h)*.55) 0 calc(var(--badge-h)*1.08); /* 左内边距加大：唱片滑回来也不压住「S」 */
  border-radius:999px;
  background:transparent;       /* 背景透明，跟随所在页面 */
  box-shadow:none;
  overflow:hidden;              /* 唱片滑出徽章时被裁掉 */
  user-select:none; cursor:pointer;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  z-index:3;
}
/* 徽章文字：SVIP·柒（默认纯金色+微光，保证任何浏览器下都没有色块底） */
.svip-badge .svip-text{
  font-size:calc(var(--badge-h)*.42);
  font-weight:700; letter-spacing:.04em;
  color:#d9a32b;
  white-space:nowrap;
  text-shadow:0 0 6px rgba(230,165,40,.4);
}
/* 支持文字渐变裁切的浏览器：换金属流光（背景只裁进笔画里，不会漏出色块） */
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .svip-badge .svip-text{
    background:linear-gradient(100deg,
      #7a5410 0%, #e8b64c 12%, #fff6d8 22%, #b98420 34%,
      #6e4a0e 46%, #f2cc66 58%, #fffbe8 64%, #8a5f16 76%,
      #e0a52a 88%, #7a5410 100%);
    background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text;
    color:transparent;
    text-shadow:none;
    filter:drop-shadow(0 0 5px rgba(230,165,40,.6)) drop-shadow(0 0 12px rgba(230,165,40,.35));
    animation:svipMetal 4.5s linear infinite;
  }
}
@keyframes svipMetal{
  0%{background-position:0% 0}
  100%{background-position:100% 0}
}
/* 金色黑胶唱片 */
.svip-badge .svip-disc{
  position:absolute;
  left:calc(var(--badge-h)*.08);
  top:50%;
  width:calc(var(--badge-h)*.92); height:calc(var(--badge-h)*.92);
  margin-top:calc(var(--badge-h)*-.46);
  border-radius:50%;
  box-shadow:
    0 0 0 1px rgba(240,190,80,.75),
    0 0 12px rgba(235,175,50,.6),
    0 0 22px rgba(230,165,40,.38),
    0 2px 8px rgba(0,0,0,.7);
  z-index:2;
  /* 唱片纹理：黑胶外圈的暗槽（金芯区域不留槽） */
  background-image:
    repeating-radial-gradient(circle,
      transparent 0 39%, rgba(0,0,0,.5) 39% 41%, transparent 41% 46%,
      rgba(0,0,0,.5) 46% 48%, transparent 48% 53%,
      rgba(0,0,0,.5) 53% 55%, transparent 55% 60%,
      rgba(0,0,0,.5) 60% 62%, transparent 62% 67%,
      rgba(0,0,0,.5) 67% 69%, transparent 69% 74%,
      rgba(0,0,0,.5) 74% 76%, transparent 76% 81%,
      rgba(0,0,0,.5) 81% 83%, transparent 83% 100%),
    radial-gradient(circle,
      #6e4c0e 0%, #6e4c0e 7%,
      #ffe9a8 8%, #fff8dc 20%,
      #f7cf5e 21%, #e0a528 34%,
      #c8881a 35%, #a86f10 38%,
      #17110a 39%, #221809 62%,
      #2e2212 63%, #191208 82%,
      #e9b949 83%, #ffe9a8 92%,
      #fff4cd 96%, #d9a832 100%);
  animation:svip-sweep 3s cubic-bezier(.45,.05,.35,1) infinite;
}
/* 唱片金属高光：斜向镜面反光 + 圆周光斑，随唱片一起转 */
.svip-badge .svip-disc::after{
  content:''; position:absolute; inset:0; border-radius:50%;
  background:
    linear-gradient(135deg,
      rgba(255,255,255,.60) 0%, rgba(255,255,255,.18) 16%,
      rgba(255,255,255,0) 30%, rgba(255,255,255,0) 52%,
      rgba(255,250,230,.34) 66%, rgba(255,255,255,0) 78%),
    conic-gradient(from 210deg,
      rgba(255,255,255,0) 0deg, rgba(255,244,200,.50) 18deg,
      rgba(255,255,255,0) 52deg, rgba(255,255,255,0) 158deg,
      rgba(255,244,200,.42) 188deg, rgba(255,255,255,0) 226deg,
      rgba(255,255,255,0) 360deg);
  mix-blend-mode:screen;
  pointer-events:none;
}
/* 滑动轨迹 */
@keyframes svip-sweep{
  0%   { left:calc(var(--badge-h)*.08);  transform:rotate(0deg); }
  12%  { left:calc(var(--badge-h)*.08);  transform:rotate(0deg); }
  40%  { left:calc(100% - var(--badge-h)*1.0); transform:rotate(300deg); }
  68%  { left:calc(var(--badge-h)*.08);  transform:rotate(360deg); }
  100% { left:calc(var(--badge-h)*.08);  transform:rotate(360deg); }
}

/* ===== 玻璃小标签：头像下方，透明玻璃+凸起质感，并排换行 ===== */
.tagrow{
  display:flex; flex-wrap:nowrap; justify-content:center; gap:8px;
  margin:14px 14px 0; white-space:nowrap;
}
.gtag{
  padding:5px 13px; border-radius:12px;
  background:rgba(255,255,255,.30);
  border:1px solid rgba(255,255,255,.72);
  backdrop-filter:blur(5px) saturate(120%);
  -webkit-backdrop-filter:blur(5px) saturate(120%);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.9),
    inset 0 -1px 0 rgba(70,105,72,.12),
    0 4px 10px rgba(70,105,72,.14);
  color:#131f15; font-weight:600; font-size:11.5px; letter-spacing:.1em;
  text-shadow:0 1px 0 rgba(255,255,255,.8);
  transition:.25s var(--ease);
}
.gtag:active{transform:scale(.94)}

.stats{display:flex; justify-content:center; gap:44px; margin-top:16px}
.stats div{cursor:pointer}
.stats b{display:block; font-size:18px; font-weight:500}
.stats span{font-size:11px; opacity:.85}

/* ===== 个人信息区（留空占位） ===== */
.pinfo{
  margin:18px 14px 0; padding:14px 16px 16px;
  background:rgba(255,255,255,.24);
  border:1px solid rgba(255,255,255,.62);
  border-radius:16px;
  backdrop-filter:blur(4px) saturate(120%);
  -webkit-backdrop-filter:blur(4px) saturate(120%);
  box-shadow:0 6px 18px rgba(70,105,72,.10);
}
.pinfo h3{
  margin:0 0 10px; font-size:13px; font-weight:600; letter-spacing:.26em;
  color:#131f15; text-shadow:0 1px 0 rgba(255,255,255,.8);
}
.pinfo .line{
  min-height:20px; border-bottom:1px dashed rgba(70,105,72,.22);
  color:#1a261c; font-weight:500;
}
.pinfo .blank{ height:34px }

/* ===== 时间·天气行：左翻页日历立牌 + 右磨砂天气 ===== */
.dtrow{
  display:flex; gap:12px; margin:18px 14px 0;
}
.cal{
  flex:0 0 132px; border-radius:16px; overflow:visible; position:relative;
  color:#141f16; text-shadow:0 1px 0 rgba(255,255,255,.8);
}
.cal .cal-body{
  border-radius:16px 16px 0 0; overflow:hidden;
  background:rgba(255,255,255,.28);
  border:1px solid rgba(255,255,255,.68);
  backdrop-filter:blur(5px) saturate(120%);
  -webkit-backdrop-filter:blur(5px) saturate(120%);
  box-shadow:0 8px 22px rgba(70,105,72,.14);
}
.cal-date{
  text-align:center; font-size:11.5px; font-weight:600; color:#141f16; letter-spacing:.2em;
  padding:9px 0 7px; border-bottom:1px solid rgba(255,255,255,.7);
  background:rgba(196,222,196,.34); white-space:nowrap;
}
.cal-digits{
  display:flex; align-items:center; justify-content:center; gap:6px;
  padding:12px 0 14px; perspective:420px;
}
.flipcard{
  display:inline-block; min-width:36px; text-align:center;
  font-size:32px; font-weight:500; line-height:1;
  background:linear-gradient(180deg, rgba(255,255,255,.92) 0%, rgba(255,255,255,.66) 49%, rgba(210,232,210,.62) 51%, rgba(255,255,255,.66) 100%);
  border:1px solid rgba(255,255,255,.85);
  border-radius:7px; padding:10px 6px;
  box-shadow:0 2px 6px rgba(70,105,72,.10);
}
.flipcard.flip{animation:flipx .55s var(--ease)}
@keyframes flipx{
  0%{transform:rotateX(-86deg); opacity:.15}
  100%{transform:none; opacity:1}
}
.wx{
  flex:1; align-self:stretch; display:flex; align-items:center; justify-content:flex-start; gap:14px; padding:9px 16px;
  border-radius:14px;
  background:rgba(255,255,255,.22);
  border:1px solid rgba(255,255,255,.62);
  backdrop-filter:blur(3px) saturate(115%);
  -webkit-backdrop-filter:blur(3px) saturate(115%);
  color:#1c2a1f; text-shadow:0 1px 0 rgba(255,255,255,.65);
  box-shadow:0 6px 16px rgba(70,105,72,.12);
}
.wx-icon{font-size:28px; flex-shrink:0}
.wx-main{ text-align:left; flex:1; min-width:0 }
.wx-main b{display:block; font-size:25px; font-weight:600; line-height:1.15}
.wx-main span{display:block; font-size:12.5px; opacity:.9; letter-spacing:.12em; margin-top:2px; white-space:nowrap}

/* ===== 一句话介绍（横板，留空） ===== */
.oneliner{
  margin:14px 14px 0; min-height:48px;
  border-radius:14px;
  background:rgba(255,255,255,.26);
  border:1px solid rgba(255,255,255,.64);
  backdrop-filter:blur(4px) saturate(120%);
  -webkit-backdrop-filter:blur(4px) saturate(120%);
  display:flex; align-items:center; padding:10px 16px;
  color:#131f15; font-weight:600; font-size:14px; letter-spacing:.14em;
  text-shadow:0 1px 0 rgba(255,255,255,.8);
  box-shadow:0 6px 18px rgba(70,105,72,.10);
}

/* ===== 图片轮播（横滑 + 右箭头翻页） ===== */
.galwrap{position:relative; margin:14px 0 0}
.hscroll{
  display:flex; gap:10px; overflow-x:auto; padding:0 14px 4px;
  scroll-snap-type:x mandatory;
  scrollbar-width:none; -webkit-overflow-scrolling:touch;
}
.hscroll::-webkit-scrollbar{display:none}
.gal-card{
  flex:0 0 76%; height:216px; scroll-snap-align:center;
  border-radius:16px; overflow:hidden; cursor:pointer;
  background:rgba(255,255,255,.26);
  border:1px solid rgba(255,255,255,.66);
  backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  box-shadow:0 6px 18px rgba(70,105,72,.10);
}
.gal-card img{width:100%; height:100%; object-fit:cover; display:block}
.gal-next{
  position:absolute; right:22px; top:50%; transform:translateY(-50%);
  width:44px; height:44px; border-radius:50%; z-index:3;
  background:rgba(255,255,255,.55);
  border:1px solid rgba(255,255,255,.85);
  backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
  color:#3a4d3e; font-size:21px; cursor:pointer; font-family:inherit;
  display:grid; place-items:center;
  box-shadow:0 6px 18px rgba(70,105,72,.20);
  transition:.25s var(--ease);
}
.gal-next:active{transform:translateY(-50%) scale(.92)}
.gal-next.hide{opacity:0; pointer-events:none}

/* 头部删掉徽章/数据行后留出的空位 */
.head-gap{height:26px}

/* ===== 主体玻璃面板 ===== */
.sheet{
  flex:1; margin-top:16px;
  background:rgba(255,255,255,.26);
  border:1px solid rgba(255,255,255,.60);
  border-radius:22px 22px 0 0;
  backdrop-filter:blur(6px) saturate(120%);
  -webkit-backdrop-filter:blur(6px) saturate(120%);
  box-shadow:0 -10px 40px rgba(70,105,72,.10);
  padding:18px 16px 130px;
}

/* Tab 行 */
.tabs{display:flex; justify-content:space-around; margin-bottom:6px}
.tabs button{
  background:transparent; border:none; cursor:pointer; font-family:inherit;
  font-size:16px; color:#4c5c50; font-weight:500; padding:8px 10px; position:relative;
  transition:.25s var(--ease);
}
.tabs button.active{color:var(--ink); font-weight:500}
.tabs button.active::after{
  content:""; position:absolute; left:50%; transform:translateX(-50%); bottom:0;
  width:22px; height:3px; border-radius:3px; background:var(--ink);
}

.subtabs{display:flex; gap:16px; align-items:center; font-size:12.5px; color:var(--ink-3);
  padding:10px 2px 12px}
.subtabs .on{color:var(--ink); font-weight:500}
.subtabs .ghost{margin-left:auto; opacity:.7; font-size:13px}

/* 列表项 */
.row{
  display:flex; align-items:center; gap:12px;
  padding:10px 10px; border-radius:14px;
  transition:.25s var(--ease); cursor:pointer;
}
.row:hover{background:rgba(255,255,255,.5)}
.row img{width:52px; height:52px; border-radius:10px; object-fit:cover; flex-shrink:0}
.row .info{flex:1; min-width:0}
.row .info b{display:block; font-size:14px; font-weight:500;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .info span{font-size:11.5px; color:var(--ink-3)}
.row .pill{
  flex-shrink:0; font-size:11px; color:var(--ink-2);
  border:1px solid rgba(0,0,0,.14); border-radius:999px;
  padding:4px 11px; background:rgba(255,255,255,.5);
  display:flex; align-items:center; gap:5px;
}
.row .more{color:var(--ink-3); flex-shrink:0; padding:0 4px}

/* 文本行（须知/板评/话术）：日式留白风，无封面 */
.irow{
  display:flex; align-items:center; justify-content:space-between;
  padding:17px 12px; border-radius:14px; cursor:pointer;
  border-bottom:1px solid rgba(0,0,0,.06);
  transition:.25s var(--ease);
}
.irow:last-of-type{border-bottom:none}

/* ===== 板评/话术：图片空位拼贴 ===== */
.bp-wrap{ padding:4px 2px 50px }
.bp-row{ display:flex; gap:10px; margin-bottom:10px; align-items:stretch }
.bp-col{ flex:1; display:flex; flex-direction:column; gap:10px }
.bp-slot{
  position:relative; flex:1; min-height:0;
  border-radius:12px;
  border:1.5px dashed rgba(255,255,255,.85);
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  color:rgba(52,66,56,.55);
}
.bp-plus{ font-size:20px; font-weight:300; line-height:1 }
.bp-cap{ font-size:10.5px; letter-spacing:.14em }
.bp-dia-wrap{ flex:1; display:flex; align-items:center; justify-content:center }
.bp-dia{
  width:104px; height:104px; flex:none;
  transform:rotate(45deg);
}
/* ===== 话术：透明底菱形拼贴（顶部头像 + 错落空位 + 玻璃圆点缀） ===== */
.wmsg-wrap{
  background:transparent; border-radius:10px; overflow:hidden; position:relative;
}
.wmsg-right{ position:relative; height:780px }
.wm-cir{
  position:absolute; border-radius:50%; cursor:pointer;
  background:rgba(255,255,255,.26);
  backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
  border:1.5px dashed rgba(255,255,255,.78);
  box-shadow:0 4px 14px rgba(255,255,255,.10);
}
.wm-cir.hasimg{ border:none; background:#e9ecee; overflow:hidden }
.wm-cir .wm-in{ inset:0; transform:none; color:#7f868c }
.wm-ava{ border:none; background:#f2f5f3; cursor:default;
  box-shadow:0 6px 16px rgba(70,84,76,.14) }
.wm-vert{
  position:absolute; left:4px; top:18px;
  writing-mode:vertical-rl; text-orientation:mixed;
  font-size:8px; letter-spacing:.42em; color:#a6acb2; font-weight:600;
}
/* ===== 灯箱：查看空位里的完整图片 ===== */
.cir-lightbox{
  position:fixed; inset:0; z-index:95;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  background:rgba(12,16,12,.76);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  animation:ffFade .22s ease both;

/* ===== 播客页：评论气泡 + 左播放器圆 + 右图框 ===== */
.pod-wrap{ margin-top:4px }
/* 评论气泡：参考网易云评论区排版（头像/昵称/时间/点赞/引号正文），黑色底改成透明玻璃 */
.pod-bubble{

  background:rgba(255,255,255,.42);
  border:1px solid rgba(255,255,255,.85);
  border-radius:4px 16px 16px 16px;
  backdrop-filter:blur(7px) saturate(120%);
  -webkit-backdrop-filter:blur(7px) saturate(120%);
  padding:13px 16px 12px;
  box-shadow:0 4px 14px rgba(50,80,54,.14);
}
.pod-bubble::after{
  content:""; position:absolute; left:-1px; top:-1px;
  width:0; height:0;
  border-left:14px solid rgba(255,255,255,.9);

}
.pod-cm-head{ display:flex; align-items:center; gap:10px }
.pod-cm-head img{

.pod-cm-who{ flex:1; min-width:0 }
.pod-cm-who b{ display:block; font-size:13.5px; font-weight:600; color:#131f15 }
.pod-cm-who span{ display:block; font-size:10.5px; color:#4a5a4d; letter-spacing:.06em }
.pod-cm-like{ font-size:12px; color:#4a5a4d; display:flex; align-items:center; gap:5px }

}
/* 舞台：横条贯穿中部，左播放器圆（小），右框立着 */
.pod-stage{

  height:min(352px, max(288px, calc(100vh - 500px)));

.pod-band{

.pod-band svg{ width:100%; height:100%; display:block }
.pod-circle{

.pod-life i{

/* 未上传图片时的占位 */
.pod-empty{
  position:absolute; inset:0; z-index:1;
  display:none; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  background:rgba(255,255,255,.4);

/* 箭头在图片旁（框外右侧），不再压在图上 */
.pod-nav{

/* 自定义区域：舞台下方右下角（只在底图上，不盖内容） */

/* ===== 底部迷你播放条（浅色玻璃，跟整体清透一致） ===== */
.player{

/* ===== 底部导航（黑色玻璃，通铺到屏幕最左最右） ===== */
.tabbar{

  display:flex; justify-content:space-around; align-items:center;
  padding:10px max(8px, calc(50vw - 214px)) calc(12px + env(safe-area-inset-bottom));

  -webkit-backdrop-filter:blur(12px) saturate(130%);

.tabbar button{

}

.tabbar .ti{font-size:21px}

  background:var(--red);
}

/* ===== 搜索文件夹（FolderFloat 复刻 · 透明玻璃款） ===== */
.ff-overlay{
  position:fixed; inset:0; z-index:60;
  display:flex; align-items:flex-end; justify-content:center;
  padding-bottom:110px;
  background:transparent;
  animation:ffFade .28s ease both;
}
.ff-overlay.closing{ animation:ffFadeOut .22s ease both }
@keyframes ffFade{ from{opacity:0} to{opacity:1} }
@keyframes ffFadeOut{ from{opacity:1} to{opacity:0} }

.folder-float{
  --ff-w:210px; --ff-h:150px; --ff-r:14px; --ff-tab:14px;
  --ff-spread:180px; --ff-lift:26px;
  --ff-angle:34deg; --ff-rest:16deg;
  --ff-open:520ms; --ff-close:312ms; --ff-stagger:45ms;
  --ff-spring:cubic-bezier(0.34,1.57,0.64,1);
  --ff-ease-out:cubic-bezier(0.23,1,0.32,1);
  position:relative; display:inline-block;
  width:var(--ff-w); padding-top:var(--ff-tab);
  font-family:inherit; font-size:13px; font-weight:500; line-height:1;
}
.ff-folder{ position:relative; width:var(--ff-w); height:var(--ff-h) }
.ff-back{
  position:absolute; inset:0; z-index:0; border-radius:var(--ff-r);
  background:rgba(80,104,76,.62);
  border:1px solid rgba(200,216,192,.5);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  transform:perspective(600px) rotateX(8deg);
  transform-origin:50% 100%;
}
.ff-back::before{
  content:''; position:absolute; top:calc(-1 * var(--ff-tab)); left:0;
  width:42%; height:calc(var(--ff-tab) + var(--ff-r));
  border-radius:var(--ff-r) var(--ff-r) 0 0;
  background:inherit; border:inherit; border-bottom:none;
}
.ff-paper{
  position:absolute; top:10%; right:8%; left:8%; z-index:1;
  height:50%; border-radius:6px;
  background:rgba(100,124,94,.62);
  border:1px solid rgba(206,222,196,.45);
  opacity:0; transform:translateY(10px);
  transition:transform var(--ff-close) var(--ff-ease-out), opacity var(--ff-close) ease;
}
.ff-front{
  position:absolute; right:0; bottom:0; left:0; z-index:2;
  display:flex; flex-direction:column; justify-content:flex-end; gap:5px;
  height:76%; padding:14px 16px; box-sizing:border-box;
  border-radius:var(--ff-r);
  background:rgba(94,118,88,.72);
  border:1px solid rgba(210,226,198,.6);
  backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%);
  color:#f2f7ec;
  box-shadow:0 -10px 28px rgba(40,70,45,.18);
  transform:perspective(600px) rotateX(calc(-1 * var(--ff-rest)));
  transform-origin:50% 100%;
  transition:transform var(--ff-open) var(--ff-ease-out);
}
.ff-label{ font-size:13px; font-weight:500 }
.ff-sub{ font-size:11px; opacity:.55 }
.ff-trigger{
  position:absolute; right:0; bottom:0; left:0; z-index:3;
  height:76%; margin:0; padding:0; border:0;
  border-radius:var(--ff-r); background:transparent; cursor:pointer; outline:none;
  -webkit-tap-highlight-color:transparent;
}
.folder-float[data-open] .ff-front{
  transform:perspective(600px) rotateX(calc(-1 * var(--ff-angle)));
}
.folder-float[data-open] .ff-paper{
  opacity:1; transform:translateY(0);
  transition:transform var(--ff-open) var(--ff-ease-out), opacity 200ms ease;
}
.ff-items{ position:absolute; top:var(--ff-tab); left:50%; z-index:1; width:0; height:0 }
.ff-item{
  position:absolute; top:0; left:50%;
  margin:0; padding:10px 16px; height:auto; border:0;
  border-radius:999px;
  background:rgba(106,130,100,.68);
  border:1px solid rgba(212,228,200,.55);
  backdrop-filter:blur(12px) saturate(140%); -webkit-backdrop-filter:blur(12px) saturate(140%);
  color:#f2f7ec; font:inherit; font-size:12.5px; white-space:nowrap;
  box-shadow:0 6px 18px rgba(40,70,45,.16), inset 0 1px 0 rgba(255,255,255,.5);
  cursor:pointer; outline:none;
  opacity:0; transform:translate(-50%,44px) scale(.6);
  pointer-events:none; -webkit-tap-highlight-color:transparent;
  transition:
    transform var(--ff-close) var(--ff-ease-out),
    opacity 160ms ease,
    scale 160ms var(--ff-ease-out);
}
.folder-float[data-open] .ff-item{
  opacity:1; pointer-events:auto;
  transform:translate(calc(-50% + 0px), calc(-1 * var(--ff-lift) - 46px)) rotate(-2deg) scale(1);
  transition:transform var(--ff-open) var(--ff-spring), opacity 160ms ease, scale 160ms var(--ff-ease-out);
}
.ff-item:hover{ scale:1.05 }
.ff-item:active{ scale:.97 }
.ff-item[data-pop]{ animation:ffPop 320ms var(--ff-ease-out) }
.ff-drift{ display:block; animation:ffDrift 3.2s ease-in-out infinite }
@keyframes ffDrift{ 0%,100%{ translate:0 0 } 50%{ translate:0 -3px } }
@keyframes ffPop{ 30%{ scale:1.1 } 100%{ scale:1 } }

#toast{
  position:fixed; left:50%; bottom:130px; transform:translateX(-50%) translateY(16px);
  z-index:70; background:rgba(20,20,22,.86); color:#fff;
  font-size:12.5px; padding:8px 18px; border-radius:999px;
  opacity:0; pointer-events:none; transition:.3s var(--ease);
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

.no-motion *{animation:none !important; transition:none !important}

/* ============================================================
   歌曲页：方形封面 + 侧边半圆 CD（白绿），下方歌词
   ============================================================ */
#songPage{
  position:fixed; inset:0; z-index:60;
  max-width:460px; margin:0 auto;
  display:flex; flex-direction:column;
  /* 清透：底图由 ::before 磨砂化，本层只留极浅白纱 */
  background:linear-gradient(180deg, rgba(255,255,255,.16) 0%, rgba(252,254,252,.10) 40%, rgba(244,249,245,.20) 100%);
  color:#2a382c;
  opacity:0; transform:translateY(6%); pointer-events:none;
  transition:.45s var(--ease);
}
#songPage.on{opacity:1; transform:none; pointer-events:auto}
/* 歌曲页打开时，全屏底挡住主页的树景（手机栏外两侧也遮住），背景磨砂玻璃化 */
#songPage::before{
  content:""; position:fixed; inset:0; z-index:-1;
  background:
    linear-gradient(180deg, rgba(252,254,252,.46) 0%, rgba(246,251,247,.36) 40%, rgba(236,244,238,.52) 100%),
    url("sp-bg.jpg") center/cover no-repeat,
    #eef3ee;
  filter:blur(14px) saturate(.55) brightness(1.10);
  transform:scale(1.08);
}
/* 话术页专属背景：青苔古树，磨砂 + 清透白纱 */
#songPage.hs-bg::before{
  background:
    linear-gradient(180deg, rgba(250,253,248,.30) 0%, rgba(245,251,245,.22) 40%, rgba(236,245,238,.34) 100%),
    url("hs-bg.jpg") center/cover no-repeat,
    #eaf2e8;
  filter:blur(5px) saturate(.92) brightness(1.06);
}
/* 板评页专属背景：雨滴灰玻璃（参考每日推荐），基本不模糊保留水珠质感 */
#songPage.bp-bg::before{
  background:
    linear-gradient(180deg, rgba(244,248,244,.14) 0%, rgba(244,248,244,.08) 40%, rgba(238,243,238,.18) 100%),
    url("bp-bg.jpg") center/cover no-repeat,
    #dfe3dd;
  filter:blur(1.5px) saturate(.85) brightness(1.05);
}

.sp-top{
  display:flex; align-items:center; gap:12px;
  padding:14px 16px; border-bottom:1px solid rgba(255,255,255,.75);
}
.sp-back{
  width:32px; height:32px; border-radius:50%;
  border:1px solid rgba(255,255,255,.9); background:rgba(255,255,255,.55);
  font-size:19px; line-height:1; cursor:pointer; color:#2a382c;
  font-family:inherit;
  box-shadow:0 3px 10px rgba(70,105,72,.14);
}
.sp-top b{font-size:16px; font-weight:500; letter-spacing:.18em;
  text-shadow:0 1px 0 rgba(255,255,255,.8)}
.sp-live{
  margin-left:auto; width:8px; height:8px; border-radius:50%;
  background:#7fa585; box-shadow:0 0 0 4px rgba(127,165,133,.18);
}
.sp-body{
  flex:1; display:flex; flex-direction:column; align-items:center;
  gap:20px; padding:26px 20px 24px; min-height:0;
}

/* —— 上：方形封面 + 半圆 CD ——
   唱片是直径 200 的一整张圆盘，圆心压在方块右边缘上，
   被方块盖住左半边，只露出右半边（含上下露出的弧） */
.sp-left{
  width:352px; flex-shrink:0;
  display:flex; flex-direction:column; align-items:center; gap:14px;
  transition:transform 1.15s var(--ease), opacity .8s var(--ease);
}
#songPage.intro .sp-left{
  transform:translateY(calc(50vh - 210px)) scale(1.16);
}
/* 封面 + 半圆的舞台 */
.disc-stage{
  position:relative; width:352px; height:200px; flex-shrink:0;
}

/* 方形封面：先出现，压在唱片上面（z-index 高），垂直居中 —— 白灰配色 */
.cover{
  position:absolute; left:84px; top:16px; z-index:2;
  width:168px; height:168px; border-radius:10px; overflow:hidden;
  background:
    linear-gradient(150deg, #ffffff 0%, #f4f6f5 46%, #d8dedb 100%);
  box-shadow:
    0 14px 34px rgba(70,80,75,.22),
    0 2px 6px rgba(70,80,75,.14),
    inset 0 0 0 1px rgba(255,255,255,.95);
  opacity:0;
  transform:translateY(16px) scale(.9);
  transition:opacity .7s var(--ease), transform .8s var(--ease);
}
#songPage.intro .cover,
#songPage.settle .cover{ opacity:1; transform:none }

/* 方形封面里：专辑封面铺满整卡，细框浮在上层 */
.cover img{
  position:absolute; inset:0; margin:auto;
  width:100%; height:100%; object-fit:cover;
  border-radius:10px;
}
.cover .cv-frame{
  position:absolute; inset:10px; border-radius:6px; z-index:2;
  border:1px solid rgba(255,255,255,.55); pointer-events:none;
}
.cover .cv-tag{
  position:absolute; left:12px; bottom:10px; z-index:2;
  font-size:8.5px; letter-spacing:.26em; color:#8b948f;
}

/* 唱片：直径 200 的完整圆盘，圆心在方块右边缘（x=252, y=100），
   z-index 低于方块 → 左半边被方块盖住，只露右半边；绕自己圆心自转 */
.cdwrap{
  position:absolute; left:152px; top:0; z-index:1;
  width:200px; height:200px;
  opacity:0; transform:scale(.92);
  transition:opacity .7s var(--ease), transform .95s var(--ease);
}
#songPage.pull .cdwrap,
#songPage.settle .cdwrap{ opacity:1; transform:scale(1) }
.cd{
  width:100%; height:100%; border-radius:50%; overflow:hidden;
  background:
    repeating-radial-gradient(circle at 50% 50%,
      rgba(255,255,255,.15) 0 1px, rgba(0,0,0,.22) 1px 3px),
    radial-gradient(circle at 34% 26%, #4d4f4e 0%, #292b2a 40%, #141615 76%, #080909 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.28), 0 10px 26px rgba(50,58,53,.28);
  animation:cd-spin 16s linear infinite;
}
@keyframes cd-spin{
  from{ transform:rotate(0deg) }
  to{ transform:rotate(360deg) }
}
.cd.paused{ animation-play-state:paused }
/* 盘心一圈白 */
.cd::after{
  content:""; position:absolute; inset:0; margin:auto;
  width:26px; height:26px; border-radius:50%;
  background:radial-gradient(circle, #ffffff 0 32%, rgba(255,255,255,.2) 60%, transparent 72%);
  box-shadow:inset 0 0 0 1px rgba(120,128,124,.45);
}

/* 读盘杆（唱臂）：轴心贴在方形封面右下角，杆身斜搭到圆形唱片上 */
.tonearm{
  position:absolute; left:221px; top:158px; z-index:3;
  width:16px; height:76px;
  transform-origin:50% 9px; transform:rotate(-78deg);
  opacity:0; transition:opacity .6s var(--ease) .5s;
}
#songPage.pull .tonearm,
#songPage.settle .tonearm{ opacity:1 }
.ta-base{
  position:absolute; top:-2px; left:50%; transform:translateX(-50%);
  width:22px; height:22px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ffffff, #d3d8d5 58%, #aeb5b1);
  box-shadow:0 3px 8px rgba(70,80,75,.32), inset 0 0 0 1px rgba(255,255,255,.75);
}
.ta-base::after{
  content:""; position:absolute; inset:0; margin:auto;
  width:6px; height:6px; border-radius:50%; background:#838a86;
}
.ta-arm{
  position:absolute; top:8px; left:50%; transform:translateX(-50%);
  width:4px; height:60px; border-radius:3px;
  background:linear-gradient(180deg, #eef0ef, #b9bfbb);
  box-shadow:0 2px 6px rgba(70,80,75,.28);
}
.ta-head{
  position:absolute; bottom:-2px; left:50%;
  transform:translateX(-50%);
  width:9px; height:9px; border-radius:50%;
  background:#838a86;
  box-shadow:0 1px 3px rgba(70,80,75,.3);
}

.sp-song{text-align:center; text-shadow:0 1px 0 rgba(255,255,255,.8)}
.sp-song b{display:block; font-size:15.5px; font-weight:500; letter-spacing:.1em}
.sp-song span{font-size:11.5px; color:rgba(58,80,62,.62); letter-spacing:.14em}

/* —— 下：歌词排版（CD 落位后才缓缓浮现） —— */
.sp-lyrics{
  flex:1; width:100%; min-width:0; overflow-y:auto;
  padding:10px 6px 60px;
  scrollbar-width:none;
  mask-image:linear-gradient(180deg, transparent 0, #000 26px, #000 calc(100% - 40px), transparent);
  -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 26px, #000 calc(100% - 40px), transparent);
  opacity:0; transform:translateY(32px);
  transition:opacity 1s var(--ease) .12s, transform 1s var(--ease) .12s;
}
#songPage.settle .sp-lyrics{opacity:1; transform:none}
.sp-lyrics::-webkit-scrollbar{display:none}
.sp-line{
  margin-bottom:22px; cursor:pointer;
  transition:.3s var(--ease);
}
.sp-line time{
  display:block; font-size:10.5px; color:rgba(58,80,62,.44);
  letter-spacing:.14em; margin-bottom:3px;
}
.sp-line p{
  font-size:15.5px; color:rgba(42,56,44,.74); line-height:1.6;
  letter-spacing:.08em;
}
.sp-line.on p{color:#1e2b21; font-weight:500; font-size:17px}
.sp-line:hover p{color:#1e2b21}

/* ============================================================
   开屏动画
   ============================================================ */
#splash{
  position:fixed; inset:0; z-index:100; display:none;
  flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:32px; cursor:pointer;
  background:rgba(10,12,10,.55);
  backdrop-filter:blur(30px) saturate(140%);
  -webkit-backdrop-filter:blur(30px) saturate(140%);
  transition:opacity .9s var(--ease), transform .9s var(--ease), filter .9s var(--ease);
}
#splash.on{display:flex}
#splash.hide{opacity:0; transform:scale(1.05); filter:blur(10px); pointer-events:none}

#splash .s-avatar{
  width:110px; height:110px; border-radius:50%; object-fit:cover;
  border:3px solid rgba(255,255,255,.9);
  box-shadow:0 0 0 12px rgba(255,255,255,.06), 0 22px 60px rgba(0,0,0,.6);
  margin-bottom:26px;
  animation:s-rise 1.2s var(--ease) both;
}
#splash .s-eyebrow{
  font-size:10.5px; letter-spacing:.44em; text-transform:uppercase;
  color:rgba(255,255,255,.72); margin-bottom:16px;
  animation:s-rise 1.2s var(--ease) .12s both;
}
#splash h1{
  font-size:clamp(28px,7vw,40px); font-weight:400; color:#fff;
  margin:0 0 14px; letter-spacing:.1em; line-height:1.25;
  text-shadow:0 2px 24px rgba(0,0,0,.5);
  animation:s-rise 1.2s var(--ease) .24s both;
}
#splash p{
  color:rgba(255,255,255,.8); margin:0 0 40px; font-size:14px; letter-spacing:.04em;
  animation:s-rise 1.2s var(--ease) .36s both;
}
#splash .s-btn{
  background:rgba(255,255,255,.14); color:#fff;
  border:1px solid rgba(255,255,255,.55);
  padding:13px 42px; border-radius:999px; font-size:13.5px; cursor:pointer;
  font-family:inherit; letter-spacing:.24em;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  transition:.4s var(--ease);
  animation:s-rise 1.2s var(--ease) .48s both;
}
#splash .s-btn:hover{background:rgba(255,255,255,.28); letter-spacing:.32em}
@keyframes s-rise{
  from{opacity:0; transform:translateY(24px)}
  to{opacity:1; transform:none}
}
</style>

const $  = id => document.getElementById(id);
const el = (t,c,h)=>{ const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n; };
const safe = s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
const toast = m=>{ const t=$('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),1800); };

/* ---------- 头像：值是「?」时渲染神秘问号，否则当图片 URL ---------- */
function mysteryAvatar(){
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">' +
    '<defs><radialGradient id="g" cx="38%" cy="32%" r="80%">' +
    '<stop offset="0" stop-color="#3a4438"/><stop offset="1" stop-color="#151b14"/>' +
    '</radialGradient></defs>' +
    '<circle cx="100" cy="100" r="98" fill="url(#g)"/>' +
    '<circle cx="100" cy="100" r="98" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="3"/>' +
    '<text x="100" y="138" text-anchor="middle" font-family="Songti SC,SimSun,serif" ' +
    'font-size="104" fill="rgba(244,246,240,.92)">？</text>' +
    '</svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function avatarSrc(v){
  if(!v) return '';
  if(v === '?' ) return mysteryAvatar();
  return v;
}

/* ---------- 头部 ---------- */
function renderHead(c){
  if(c.background) $('bg').style.backgroundImage = 'url("'+c.background+'")';
  if(c.avatar) $('avatar').src = avatarSrc(c.avatar);
  $('name').textContent   = c.name || '';
  $('vip').textContent    = c.vipText || '';
  /* 徽章/数据行已删，只留空位 */
  /* 一句话介绍：前面一个圆点 + 前后中文引号 */
  $('oneliner').textContent = c.intro ? '·「' + c.intro + '」' : '';
  /* 玻璃小标签：头像下方并排（自动换行，约三个一行） */
  const tr = $('tagrow');
  tr.innerHTML = '';
  const tags = c.tags || [];
  if(!tags.length){ tr.style.display='none'; }
  else{
    tr.style.display='';
    tags.forEach(t=> tr.appendChild(el('span','gtag', safe(t.text||''))));
  }
  /* 个人信息区（默认留空） */
  const pi = c.profile || {};
  const pBox = $('pinfo');
  pBox.innerHTML = '';
  pBox.appendChild(el('h3', null, safe(pi.title || '个人信息')));
  const lines = pi.lines || [];
  if(lines.length){
    lines.forEach(t=> pBox.appendChild(el('div','line', safe(t))));
  }else{
    /* 留空待定：不放占位文字，只留一块空白高度 */
    pBox.appendChild(el('div','blank'));
  }
  document.title = (c.name||'') + ' · 主页';
}

/* ---------- 时间：翻页日历立牌 ---------- */
function setFlip(node, val){
  if(!node || node.textContent === val) return;
  node.textContent = val;
  node.classList.remove('flip'); void node.offsetWidth; node.classList.add('flip');
}
function tickClock(){
  const d = new Date();
  setFlip($('calH'), String(d.getHours()).padStart(2,'0'));
  setFlip($('calM'), String(d.getMinutes()).padStart(2,'0'));
  $('calDate').textContent = (d.getMonth()+1)+'月'+d.getDate()+'日 '+'星期'+'日一二三四五六'[d.getDay()];
}

/* ---------- 天气：固定城市（哈尔滨）+ Open-Meteo 实时，图标随时间/天气变化 ---------- */
/* 简约线性 SVG 图标（stroke 线条风，替代彩色 emoji） */
function wxIconSvg(kind){
  var S = function(inner){
    return '<svg viewBox="0 0 48 48" width="30" height="30" fill="none" stroke="currentColor" '
         + 'stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';
  };
  var SUN = '<circle cx="24" cy="24" r="8.5"/>'
    + '<path d="M24 5.5v4.5"/><path d="M24 38v4.5"/><path d="M5.5 24H10"/><path d="M38 24h4.5"/>'
    + '<path d="M10.8 10.8l3.2 3.2"/><path d="M34 34l3.2 3.2"/><path d="M37.2 10.8L34 14"/><path d="M14 34l-3.2 3.2"/>';
  var CLOUD = '<path d="M15 34a7.2 7.2 0 0 1-.4-14.4 10 10 0 0 1 19.3-2.6A7.6 7.6 0 0 1 33.2 34z"/>';
  switch(kind){
    case 'sun':      return S(SUN);
    case 'moon':     return S('<path d="M31.5 29A13 13 0 0 1 19 16.5 13 13 0 1 0 31.5 29z"/>');
    case 'cloudsun': return S('<circle cx="17" cy="16" r="6"/>'
                           + '<path d="M17 5.5v3"/><path d="M6.5 16h3"/><path d="M9.5 8.5l2.1 2.1"/><path d="M24.5 8.5l-2.1 2.1"/>'
                           + '<path d="M17 38a6.2 6.2 0 0 1-.3-12.4 9 9 0 0 1 17.4-2.3A6.8 6.8 0 0 1 32.6 38z"/>');
    case 'cloud':    return S(CLOUD);
    case 'fog':      return S(CLOUD + '<path d="M14 39.5h20"/><path d="M18 43.5h12"/>');
    case 'rain':     return S(CLOUD + '<path d="M17 38.5l-1.8 4.5"/><path d="M25 38.5l-1.8 4.5"/><path d="M33 38.5l-1.8 4.5"/>');
    case 'snow':     return S(CLOUD + '<path d="M16 40.5v3"/><path d="M14.5 42h3"/><path d="M25 40.5v3"/><path d="M23.5 42h3"/><path d="M34 40.5v3"/><path d="M32.5 42h3"/>');
    case 'thunder':  return S(CLOUD + '<path d="M25 35.5l-4.5 5.5h5l-3.5 5"/>');
    default:         return S(CLOUD);
  }
}
function wmoInfo(code){
  if(code===0) return {t:'晴', i:'sun'};
  if(code<=2)  return {t:'多云', i:'cloudsun'};
  if(code===3) return {t:'阴', i:'cloud'};
  if(code<=48) return {t:'雾', i:'fog'};
  if(code<=57) return {t:'毛毛雨', i:'rain'};
  if(code<=67) return {t:'雨', i:'rain'};
  if(code<=77) return {t:'雪', i:'snow'};
  if(code<=82) return {t:'阵雨', i:'rain'};
  if(code<=86) return {t:'阵雪', i:'snow'};
  return {t:'雷雨', i:'thunder'};
}
/* 白天/夜里换图标：晴→白天太阳/夜里月亮；多云→白天云间太阳/夜里云 */
function daypartIcon(icon, code, hour, sunrise, sunset){
  if(code!==0 && code!==1 && code!==2) return icon;
  const night = (sunrise && sunset) ? (hour < sunrise || hour >= sunset)
                                    : (hour < 6 || hour >= 19);
  if(night)  return code===0 ? 'moon' : 'cloud';
  if(sunrise && sunset && (hour < sunrise+1.5 || hour > sunset-1.5)) return 'sun';
  return icon;
}
function wxFail(){
  const t=$('wxTemp'); if(t) t.textContent='--';
  const d=$('wxDesc'); if(d) d.textContent='天气暂不可用';
}
async function loadWeather(wa){
  const lat = wa.lat, lon = wa.lon;
  $('wxCity').textContent = wa.city || '';
  const url = 'https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon
            + '&current=temperature_2m,weather_code&daily=sunrise,sunset&timezone=auto&forecast_days=1';
  const r = await fetch(url);
  const j = await r.json();
  const cu = j && j.current;
  if(!cu) throw new Error('bad weather data');
  const code = cu.weather_code;
  const w = wmoInfo(code);
  const hh = (cu.time ? Number(cu.time.slice(11,13)) : new Date().getHours());
  const sr = j.daily && j.daily.sunrise && j.daily.sunrise[0] ? Number(j.daily.sunrise[0].slice(11,13)) : null;
  const ss = j.daily && j.daily.sunset  && j.daily.sunset[0]  ? Number(j.daily.sunset[0].slice(11,13))  : null;
  $('wxTemp').textContent = Math.round(cu.temperature_2m)+'°';
  $('wxDesc').textContent = w.t;
  $('wxIcon').innerHTML = wxIconSvg(daypartIcon(w.i, code, hh, sr, ss));
}
function renderWx(cfg){
  const wa = (cfg && cfg.weather) || {};
  /* mock 模式：config.weather = {mock:true, code, temp, city} */
  if(wa.mock){
    const w = wmoInfo(wa.code||0);
    $('wxTemp').textContent = (wa.temp ?? '--')+'°';
    $('wxDesc').textContent = w.t;
    $('wxCity').textContent = wa.city || '';
    $('wxIcon').innerHTML = wxIconSvg(w.i);
    return;
  }
  $('wxCity').textContent = wa.city || '哈尔滨';
  loadWeather(wa).catch(wxFail);
  /* 每 10 分钟刷新，图标跟着天气/时间走 */
  setInterval(()=> loadWeather(wa).catch(()=>{}), 600000);
}
function initDt(cfg){
  tickClock();
  setInterval(tickClock, 1000);
  renderWx(cfg);
}

/* ---------- 图片轮播：横滑 + 右箭头翻页 ---------- */
function renderGallery(list){
  const box = $('gallery');

  (list||[]).forEach(p=>{
    const card = el('div','gal-card');
    if(p && p.img){
      const im = el('img'); im.src = p.img; im.alt='';
      card.appendChild(im);
      card.onclick = ()=> toast('图片（占位）');
    }
    box.appendChild(card);
  });
  updateGalArrow();
}
/* 循环轮播：第 1 张之前克隆最后一张，最后一张之后克隆第一张，
   滑到克隆位置后瞬间跳回真身，看起来无缝 */
function updateGalArrow(){
  const box = $('gallery'), btn = $('galNext');
  if(!box || !btn) return;
  btn.classList.remove('hide');   /* 循环播放，箭头常显 */
}
function initGallery(cfg){
  renderGallery(cfg.gallery);
  const box = $('gallery');
  const cards = [...box.children];
  const N = cards.length;
  const gap = 10;
  const stepW = ()=>{ const c = box.querySelector('.gal-card');
    return c ? c.getBoundingClientRect().width + gap : box.clientWidth*0.8; };

  if(N > 1){
    /* 首尾各克隆一张，给循环留缓冲 */
    const first = cards[0].cloneNode(true);
    const last  = cards[N-1].cloneNode(true);
    box.insertBefore(last, cards[0]);
    box.appendChild(first);
    /* 初始定位到第一张真图（跳过前面那张克隆的末图） */
    requestAnimationFrame(()=>{ box.scrollLeft = stepW(); });
  }

  const realFirst = ()=> stepW();
  const realLast  = ()=> stepW() * N;

  let jumping = false;
  $('galNext').onclick = ()=>{
    if(jumping) return;
    box.scrollBy({left: stepW(), behavior:'smooth'});
  };
  box.addEventListener('scroll', ()=>{
    if(jumping || N <= 1) return;
    const sl = box.scrollLeft;
    /* 滑过了最后一张真图 -> 落到克隆的首图后，无动画弹回真首图 */
    if(sl >= realLast() - 4){
      jumping = true;
      box.style.scrollSnapType = 'none';
      box.scrollLeft = realFirst();
      requestAnimationFrame(()=> requestAnimationFrame(()=>{
        box.style.scrollSnapType = '';
        jumping = false;
      }));
    }else if(sl <= realFirst() - stepW() + 4){
      /* 往回滑过首图 -> 弹到最后一张真图 */
      jumping = true;
      box.style.scrollSnapType = 'none';
      box.scrollLeft = realLast();
      requestAnimationFrame(()=> requestAnimationFrame(()=>{
        box.style.scrollSnapType = '';
        jumping = false;
      }));
    }
  }, {passive:true});
}

    + '<button type="button" class="ff-item"><span class="ff-drift">我成为你的依靠了吗？</span></button>'
    + '</div>'
    + '<div class="ff-folder">'
    + '<span class="ff-back"></span>'
    + '<span class="ff-paper"></span>'
    + '<span class="ff-front"><span class="ff-sub">一则留言</span></span>'
    + '<button type="button" class="ff-trigger" aria-label="打开文件夹"></button>'
    + '</div>';
  ov.appendChild(ff);
  document.body.appendChild(ov);
  let open = false;
  const trigger = ff.querySelector('.ff-trigger');
  const item    = ff.querySelector('.ff-item');
  const setOpen = v=>{ open = v; if(v) ff.setAttribute('data-open',''); else ff.removeAttribute('data-open'); };
  trigger.addEventListener('click', e=>{ e.stopPropagation(); setOpen(!open); });
  ff.addEventListener('click', e=> e.stopPropagation());
  item.addEventListener('click', e=>{
    e.stopPropagation();
    item.setAttribute('data-pop','');
    setTimeout(()=> item.removeAttribute('data-pop'), 330);
  });
  const close = ()=>{
    ov.classList.add('closing');
    setTimeout(()=> ov.remove(), 230);
    document.removeEventListener('keydown', onEsc);
  };
  const onEsc = e=>{ if(e.key==='Escape') close(); };
  ov.addEventListener('click', close);
  document.addEventListener('keydown', onEsc);
}

/* ---------- 迷你播放条 ---------- */
function renderPlayer(np){
  if(!np) { $('player').style.display='none'; return; }
  if(np.cover) $('np-cover').src = np.cover;
  $('np-title').textContent  = np.title  || '';
  $('np-artist').textContent = np.artist || '';
  const audio = $('audio');
  audio.volume = 0.35;   /* 音量调小 */
  if(np.src) audio.src = np.src;
  /* 播完不重播：按钮回到播放态 */
  audio.addEventListener('ended', ()=>{ $('np-play').textContent='▶'; });
  $('np-play').onclick = ()=>{
    if(!audio.getAttribute('src')){ toast('还没配音频，在 config 的 nowPlaying 加 src'); return; }
    if(audio.paused){ audio.play(); $('np-play').textContent='❚❚'; }
    else { audio.pause(); $('np-play').textContent='▶'; }
  };
  $('np-list').onclick = ()=> toast('播放列表（占位）');
}

/* ---------- 不间断细雨（Canvas，requestAnimationFrame 永续循环） ---------- */
function initRain(){
  const cv = $('rain');
  if(!cv || !cv.getContext) return;
  const ctx = cv.getContext('2d');
  let W, H, drops = [];
  const N = 160;
  const resize = ()=>{
    W = cv.width  = window.innerWidth;
    H = cv.height = window.innerHeight;
  };
  resize();
  window.addEventListener('resize', resize);
  const mk = fromTop => ({
    x: Math.random()*W,
    y: fromTop ? Math.random()*-H : Math.random()*H,
    l: 14 + Math.random()*22,
    v: 6.5 + Math.random()*6,
    o: .30 + Math.random()*.34
  });
  for(let i=0;i<N;i++) drops.push(mk(false));
  const tick = ()=>{
    ctx.clearRect(0,0,W,H);
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';
    for(const d of drops){
      ctx.strokeStyle = 'rgba(255,255,255,'+d.o+')';
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - 1.2, d.y + d.l);
      ctx.stroke();
      d.y += d.v; d.x -= .35;
      if(d.y > H + 20) Object.assign(d, mk(true));
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

/* ---------- 开屏 ---------- */
function renderSplash(c){
  const box = $('splash');
  const w = c.welcome;
  if(!w){ box.style.display='none'; return; }
  if(w.avatar || c.avatar) $('s-avatar').src = avatarSrc(w.avatar || c.avatar);
  if(w.eyebrow) $('s-eyebrow').textContent = w.eyebrow;
  $('s-title').textContent = w.title || c.name || '';
  $('s-body').innerHTML  = safe(w.body || c.bio || '');
  $('s-btn').textContent   = w.btn   || '进入';
  box.classList.add('on');

  const enter = ()=>{
    box.classList.add('hide');
    setTimeout(()=>{ box.style.display='none'; }, 900);
    /* 点进页面：音乐自动播（借助点击手势，绕过浏览器自动播放限制） */
    const a = $('audio');
    if(a && a.getAttribute('src')){
      a.play().then(()=>{ const p=$('np-play'); if(p) p.textContent='❚❚'; }).catch(()=>{});
    }
  };
  $('s-btn').onclick = e=>{ e.stopPropagation(); enter(); };
  box.onclick = enter;
}

/* 板评：菱形+横幅+三块 拼贴空位（参考杂志拼版） */

  const dw = el('div','bp-dia-wrap');

  dw.appendChild(dia);
  r1.appendChild(dw);
  r1.appendChild(bpSlot(150));
  w.appendChild(r1);
  const r2 = el('div','bp-row');
  r2.appendChild(bpSlot(88));
  w.appendChild(r2);
  const r3 = el('div','bp-row');
  r3.appendChild(bpSlot(118));
  r3.appendChild(bpSlot(172));
  r3.appendChild(bpSlot(118));
  w.appendChild(r3);
  return w;
}
/* 话术：白卡菱形拼贴 —— 顶部菱形头像（百合图），下方空位错落排开，可点上传 */
function buildHuashu(){
  const w = el('div','wmsg-wrap');
  const R = el('div','wmsg-right');
  /* 空位（菱形 + 圆形）：错落排开，全部可点上传自己的图 */
  const file = el('input'); file.type='file'; file.accept='image/*'; file.style.display='none';
  let cur = null;
  const load = (key)=>{ try{ return JSON.parse(localStorage.getItem(key)||'[]') || []; }catch(e){ return []; } };
  const mkSlot = (sp, cls, key, ix, saved)=>{
    const d = el('div', cls);
    d.style.width = d.style.height = sp.s + 'px';
    ['top','left','right','bottom'].forEach(k=>{ if(sp[k]!=null) d.style[k] = sp[k] + 'px'; });
    const inn = el('div','wm-in');
    inn.appendChild(el('span','bp-plus','+'));
    d.appendChild(inn);
    if(saved[ix]){
      inn.innerHTML = '';
      const im = el('img'); im.src = saved[ix]; im.alt='';
      inn.appendChild(im);
      d.classList.add('hasimg');
    }
    d.onclick = ()=>{
      const im = d.querySelector('img');
      if(im){ openLb(im.src, { d, inn, key, ix }); return; }  /* 已有图 → 看大图 */
      cur = { d, inn, key, ix }; file.click();                /* 空位 → 上传 */
    };
    R.appendChild(d);
  };
  /* 玻璃圆：放大 + 可上传；传图后点开看大图 */
  [
    { s:120, top:36,  left:8   },
    { s:106, top:60,  right:26 },
    { s:168, top:196, left:0   },
    { s:120, top:300, left:196 },
    { s:132, top:384, left:118 },
    { s:130, top:492, left:8   },
    { s:140, top:522, right:-10 },
    { s:122, bottom:56, left:24 },
    { s:142, bottom:2,  right:56 },
  ].forEach((c,ix)=> mkSlot(c, 'wm-cir', 'hsCir', ix, load('hsCir')));
  /* 灯箱：点已填图的空位 → 全屏看完整图片；点任意处关闭，「换一张」重新选图 */
  const openLb = (src, slot)=>{
    const ov = el('div','cir-lightbox');
    const im = el('img'); im.src = src; im.alt='';
    const swap = el('button','cir-lb-swap','换一张');
    const tip = el('div','cir-lb-tip','点任意处关闭');
    ov.appendChild(im); ov.appendChild(swap); ov.appendChild(tip);
    ov.onclick = ()=> ov.remove();
    swap.onclick = (e)=>{ e.stopPropagation(); ov.remove(); cur = slot; file.click(); };
    document.body.appendChild(ov);
  };
  /* 菱形空位：错落排开，同样可点上传 */
  [
    { s:122, top:-44,  right:-46 },
    { s:152, top:118,  left:172  },
    { s:112, top:196,  left:-44  },
    { s:162, top:298,  right:-52 },
    { s:122, top:390,  left:40   },
    { s:136, top:486,  left:180  },
    { s:112, bottom:-44, left:-26 },
    { s:130, bottom:-52, right:16 },
  ].forEach((sp,ix)=> mkSlot(sp, 'wm-dia', 'hsDia2', ix, load('hsDia2')));
  file.onchange = ()=>{
    const f = file.files && file.files[0];
    if(!f || !cur) return;
    const t = cur;
    const rd = new FileReader();
    rd.onload = ()=>{
      const url = String(rd.result||'');
      t.inn.innerHTML = '';
      const im = el('img'); im.src = url; im.alt='';
      t.inn.appendChild(im);
      t.d.classList.add('hasimg');
      try{
        const arr = load(t.key);
        arr[t.ix] = url;
        localStorage.setItem(t.key, JSON.stringify(arr));
      }catch(e){}
    };
    rd.readAsDataURL(f);
  };
  w.appendChild(R);
  w.appendChild(file);
  return w;
}
function bpSlot(h){
  const d = el('div','bp-slot');
  d.style.height = h + 'px';
  d.appendChild(el('span','bp-plus','+'));
  d.appendChild(el('span','bp-cap','图片空位'));
  return d;
}
function openSongPage(title){
  $('spTitle').textContent = title || '';
  $('spLyrics').scrollTop = 0;
  /* 板评 / 话术：隐藏 CD 区，按各自排版显示图片空位拼贴 */
  const sp = $('songPage');
  const isBP = title === '板评', isHS = title === '话术';
  /* 板评页换雨滴灰玻璃背景，话术页换青苔古树磨砂背景 */
  sp.classList.toggle('bp-bg', isBP);
  sp.classList.toggle('hs-bg', isHS);
  document.querySelector('#songPage .sp-left').style.display = (isBP || isHS) ? 'none' : '';
  const box = $('spLyrics');
  const list = box.querySelector('.sp-list');
  const old = box.querySelector('.bp-wrap');
  if(old) old.remove();
  if(isBP || isHS){
    if(list) list.style.display = 'none';
    box.insertBefore(isBP ? buildBanping() : buildHuashu(), box.firstChild);
  } else if(list){
    list.style.display = '';
  }
  clearTimeout(sp._introTm);
  clearTimeout(sp._pullTm);
  /* 先复位，强制重放整段入场动画 */
  sp.classList.remove('on','intro','pull','settle');
  void sp.offsetWidth;
  /* 第一段：方形封面在屏幕中间缓缓浮现（唱片还藏在后面） */
  sp.classList.add('on','intro');
  /* 0.9s：旁边的半圆唱片从封面右边滑出来，开始转 */
  sp._introTm = setTimeout(()=>{ sp.classList.add('pull'); }, 900);
  /* 1.5s：整体缩小上移落位，下面歌词浮现 */
  sp._pullTm = setTimeout(()=>{
    sp.classList.remove('intro');
    sp.classList.add('settle');
  }, 1500);
}

/* ---------- 入口 ---------- */
async function boot(){
  let raw = DATA;
  /* 兜底一：同目录 config.json（线上静态托管 / 本地起服务器时走这条） */
  if(!raw){
    try{
      const r = await fetch('config.json');
      if(r.ok) raw = await r.json();
    }catch(e){ /* file:// 直接打开时会失败，继续下一个兜底 */ }
  }
  /* 兜底二：平台接口 */
  if(!raw){
    try{
      const r = await fetch('/api/personal-site/config');
      raw = await r.json();
    }catch(e){ console.warn('取数失败', e); raw = {}; }
  }
  const cfg = (raw && raw.config) ? raw.config : (raw || {});
  window.cfg = cfg;

  /* 每块独立渲染：任何一块挂了，不能连累后面的 */
  const step = (name, fn)=>{
    try{ fn(); }catch(e){ console.error('[渲染失败]', name, e); failSafe(name + ': ' + e.message); }
  };

  step('头部',   ()=>renderHead(cfg));
  step('时间天气', ()=>initDt(cfg));
  step('下雨动效', ()=>initRain());
  step('轮播',   ()=>initGallery(cfg));
  step('Tab',    ()=>renderTabs(cfg.tabs, cfg));
  step('播放器',  ()=>renderPlayer(cfg.nowPlaying));
  step('底栏',   ()=>renderTabbar());

  /* 开屏动画 */
  step('开屏',   ()=>renderSplash(cfg));

  /* 歌曲页 */
  step('歌曲页', ()=>renderSongPage(cfg));

  if(cfg.motion === 'False') document.body.classList.add('no-motion');
}

function failSafe(msg){ if(msg) console.error('[failSafe]', msg); }
window.addEventListener('error', e=>failSafe(e.message));
boot().catch(e=>failSafe(e));
</script>
